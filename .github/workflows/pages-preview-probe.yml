# Test only: does actions/deploy-pages `preview: true` (alpha, not public)
# work for this repo? Deploys a one-page site; check where it lands.
name: Pages preview probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Make a one-page site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          echo "<!doctype html><title>probe</title><p>preview probe $GITHUB_RUN_ID</p>" > "$RUNNER_TEMP/site/index.html"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: docs-preview-deploy
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          preview: true
      - name: Show the URL
        env:
          URL: ${{ steps.deploy.outputs.page_url }}
        run: echo "page_url=$URL" | tee -a "$GITHUB_STEP_SUMMARY"
