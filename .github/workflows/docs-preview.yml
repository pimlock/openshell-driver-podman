# Build a preview of this repo's docs. Runs the pull request's code with a
# read-only token; docs-preview-deploy.yml publishes the result.
name: Docs preview

on:
  pull_request:
    paths: [docs/**]

permissions: {}

jobs:
  build:
    uses: pimlock/openshell-docs/.github/workflows/preview-build.yml@380a067478f45f20b374a4ae84fbd554c6c713db
    with:
      docset: driver-podman
      site-ref: 380a067478f45f20b374a4ae84fbd554c6c713db
      # Every deployment rebuilds the site from these artifacts, so a preview
      # stays up this long after its last build.
      retention-days: 30
    permissions:
      contents: read
