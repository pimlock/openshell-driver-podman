# Build a preview of this repo's docs with the shared site theme. Each pull
# request gets its own preview at https://pimlock.github.io/openshell-driver-podman/pr-<n>/
# (gh-pages branch) and one comment with the link; closing the pull request
# removes it. Links into other repos are checked against the live site's
# link index; see pimlock/openshell-docs. Add the `docs-diff` label to also
# build a view that marks what changed on each page (experimental).
name: Docs preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]
    paths: [docs/**]
  workflow_dispatch:

jobs:
  docs:
    uses: pimlock/openshell-docs/.github/workflows/preview.yml@main
    with:
      docset: driver-podman
    permissions:
      contents: write
      pull-requests: write
